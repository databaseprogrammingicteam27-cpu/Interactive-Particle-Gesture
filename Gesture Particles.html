<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesture Particles</title>
<style>
:root{--bg:#05060a;--fg:#e8eaf2;--mut:#8b90a3;--panel:rgba(20,22,32,.72);--line:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));width:210px;padding:14px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
h1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;font-weight:600}
.pat{display:flex;justify-content:space-between;width:100%;padding:8px 10px;margin-bottom:6px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit}
.pat span{color:var(--mut);font-size:11px}
.pat:hover{background:rgba(255,255,255,.06)}
.pat.on{border-color:var(--c,#7aa2ff);background:rgba(255,255,255,.09)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
input[type=color]{width:44px;height:28px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.btn{padding:7px 10px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit}
.btn:hover{background:rgba(255,255,255,.08)}
.top{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:7px 14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;color:var(--mut);white-space:nowrap}
#cam{position:fixed;right:14px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:150px;border-radius:10px;border:1px solid var(--line);transform:scaleX(-1);display:none;opacity:.8}
.hint{margin-top:10px;font-size:11px;color:var(--mut)}
@media(max-width:560px){.panel{width:170px;padding:10px}}
</style></head><body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div class="panel">
  <h1>Pattern</h1>
  <div id="pats"></div>
  <div class="row"><span>Colour</span><input type="color" id="col" value="#5aa0ff"></div>
  <p class="hint">Keys 1–5 also switch pattern. Hand open/close controls size &amp; dispersion.</p>
</div>
<div class="top"><button class="btn" id="camBtn">Enable camera</button><button class="btn" id="fs">Fullscreen</button></div>
<div id="status">Camera off — use the panel or keys 1–5</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const N=22000;
const SHAPES=[
 {id:'sun',name:'Sun / Planet',hint:'fist'},
 {id:'spread',name:'Scatter',hint:'palm'},
 {id:'heart',name:'Heart',hint:'1 finger'},
 {id:'saturn',name:'Saturn',hint:'2 fingers'},
 {id:'hole',name:'Black hole',hint:'3 fingers'}];
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,100);cam.position.z=6;
const group=new THREE.Group();scene.add(group);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const pos=new Float32Array(N*3),tgt=new Float32Array(N*3),mixA=new Float32Array(N),sizeA=new Float32Array(N);
const pr=new Float32Array(N),pa=new Float32Array(N),py=new Float32Array(N),rnd=new Float32Array(N*3);
for(let i=0;i<N;i++){mixA[i]=Math.random();sizeA[i]=.5+Math.random();rnd[i*3]=Math.random()*2-1;rnd[i*3+1]=Math.random()*2-1;rnd[i*3+2]=Math.random()*2-1;
 pos[i*3]=rnd[i*3]*6;pos[i*3+1]=rnd[i*3+1]*6;pos[i*3+2]=rnd[i*3+2]*6}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('aMix',new THREE.BufferAttribute(mixA,1));
geo.setAttribute('aSize',new THREE.BufferAttribute(sizeA,1));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uColor:{value:new THREE.Color('#5aa0ff')},uPx:{value:renderer.getPixelRatio()}},
 vertexShader:`attribute float aMix;attribute float aSize;uniform float uPx;varying float vM;
 void main(){vM=aMix;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=aSize*2.6*uPx*(6./-mv.z);}`,
 fragmentShader:`uniform vec3 uColor;varying float vM;
 void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);
 gl_FragColor=vec4(mix(uColor,vec3(1.),vM*.55),a*.75);}`});
group.add(new THREE.Points(geo,mat));

// ---- shape targets ----
const R=Math.random;
function sph(r){const u=R()*2-1,t=R()*6.2832,s=Math.sqrt(1-u*u);return[r*s*Math.cos(t),r*u,r*s*Math.sin(t)]}
function build(id){
 for(let i=0;i<N;i++){let x,y,z;const k=i*3;
  if(id==='sun'){const r=1.5*(R()<.8?1:Math.cbrt(R()));[x,y,z]=sph(r)}
  else if(id==='spread'){[x,y,z]=sph(4.5*Math.cbrt(R()))}
  else if(id==='heart'){const t=R()*6.2832,s=Math.sqrt(R())*.98+.02;
   x=16*Math.pow(Math.sin(t),3)/11;y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/11+.1;
   x*=s;y*=s;z=(R()*2-1)*.55*(1-s*.3)}
  else if(id==='saturn'){
   if(R()<.5){[x,y,z]=sph(.85*Math.cbrt(R()+.3))}
   else{const a=R()*6.2832,r=1.3+R()*1.1;x=Math.cos(a)*r;z=Math.sin(a)*r;y=(R()-.5)*.04;
    // tilt ring
    const c=Math.cos(.45),s2=Math.sin(.45);const yy=y*c-x*s2;x=x*c+y*s2;y=yy}}
  else{pr[i]=.55+Math.pow(R(),1.6)*2.6;pa[i]=R()*6.2832;py[i]=(R()-.5)*.12*(pr[i]);x=y=z=0}
  tgt[k]=x;tgt[k+1]=y;tgt[k+2]=z}
}
// ---- state ----
let shape='sun',openness=.5,scaleS=1,disp=0,lastRaw=null,hold=0,handSeen=false,t0=performance.now();
const pats=document.getElementById('pats'),status=document.getElementById('status');
SHAPES.forEach((s,i)=>{const b=document.createElement('button');b.className='pat';b.dataset.id=s.id;
 b.innerHTML=`${s.name}<span>${s.hint}</span>`;b.onclick=()=>setShape(s.id);pats.appendChild(b)});
function setShape(id){if(id===shape&&build.done)return;shape=id;build(id);build.done=1;
 pats.querySelectorAll('.pat').forEach(b=>b.classList.toggle('on',b.dataset.id===id));}
setShape('sun');
document.getElementById('col').oninput=e=>{mat.uniforms.uColor.value.set(e.target.value);document.documentElement.style.setProperty('--c',e.target.value)};
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=5)setShape(SHAPES[n-1].id)});
document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

// ---- hand tracking ----
const video=document.getElementById('cam');
function d2(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z-b.z)*.5)}
function onHand(res){
 const L=res.multiHandLandmarks&&res.multiHandLandmarks[0];
 if(!L){handSeen=false;status.textContent='No hand detected';return}
 handSeen=true;
 const w=L[0],tips=[8,12,16,20],pips=[6,10,14,18];let ext=0,ratio=0;
 tips.forEach((t,i)=>{if(d2(L[t],w)>d2(L[pips[i]],w)*1.12)ext++;ratio+=d2(L[t],w)});
 const palm=d2(w,L[9]);ratio=ratio/4/palm;           // ~1.0 fist .. ~2.0 open
 const o=Math.min(1,Math.max(0,(ratio-1.1)/.9));openness+=(o-openness)*.35;
 let g=ext===0?'sun':ext===1?'heart':ext===2?'saturn':ext===3?'hole':'spread';
 if(g===lastRaw){hold++}else{lastRaw=g;hold=0}
 if(hold>=4&&g!==shape)setShape(g);
 status.textContent=`${SHAPES.find(s=>s.id===shape).name} · fingers ${ext} · openness ${(openness*100)|0}%`;
}
document.getElementById('camBtn').onclick=async function(){
 this.disabled=true;status.textContent='Loading hand model…';
 try{
  if(typeof Hands==='undefined')throw 0;
  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(onHand);
  const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
  video.srcObject=s;await video.play();video.style.display='block';this.style.display='none';
  const loop=async()=>{try{await hands.send({image:video})}catch(e){}requestAnimationFrame(loop)};loop();
 }catch(e){status.textContent='Camera/hand model unavailable — use panel or keys 1–5';this.disabled=false}
};

// ---- loop ----
function frame(now){
 const t=(now-t0)/1000;
 // openness drives size & dispersion (default idle breathing when no hand)
 const o=handSeen?openness:.5+.12*Math.sin(t*1.2);
 const tgtScale=.55+o*1.15;scaleS+=(tgtScale-scaleS)*.12;
 const ds=Math.max(0,o-.55)*1.6;disp+=(ds-disp)*.12;
 const hole=shape==='hole',k=.07;
 for(let i=0;i<N;i++){const j=i*3;let x,y,z;
  if(hole){const r=pr[i]*scaleS,a=pa[i]+t*1.6/Math.pow(pr[i],1.1);x=Math.cos(a)*r;z=Math.sin(a)*r;y=py[i]*scaleS;}
  else{x=tgt[j]*scaleS;y=tgt[j+1]*scaleS;z=tgt[j+2]*scaleS;
   const jit=.03+(shape==='spread'?.25:0);x+=Math.sin(t*1.7+i)*jit;y+=Math.cos(t*1.3+i*1.7)*jit;}
  x+=rnd[j]*disp*2.2;y+=rnd[j+1]*disp*2.2;z+=rnd[j+2]*disp*2.2;
  pos[j]+=(x-pos[j])*k;pos[j+1]+=(y-pos[j+1])*k;pos[j+2]+=(z-pos[j+2])*k}
 geo.attributes.position.needsUpdate=true;
 group.rotation.y=hole?0:t*.25;
 group.rotation.x=hole?.5:(shape==='saturn'?.25:0);
 renderer.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
